[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-education"
version = "0.1.0"
description = "面向新高考全国Ⅰ卷的个性化学习规划智能体"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "langchain>=1.3,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "pypdf>=6.0,<7",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0,<2"]
knowledge = ["rapidocr_onnxruntime>=1.4,<2"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
ai-education = "ai_education.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_education = ["resources/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
